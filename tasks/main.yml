---
# tasks file for haproxy_remote_local_fallback
#

# Install HAProxy
- name: Install haproxy
  ansible.builtin.package:
    name: haproxy
    state: present
  become: true

# Copy custom haproxy config
- name: Copy additional configs
  ansible.builtin.template:
    src: "templates/remote_local_fallback.cfg.j2"
    dest: "/etc/haproxy/remote_local_fallback.cfg"
    mode: "0644"
  become: true

# Add custom haproxy config to systemd service file
- name: Include custom haproxy config in systemd service file
  ansible.builtin.lineinfile:
    path: "/usr/lib/systemd/system/haproxy.service"
    regexp: '^Environment='
    line: Environment="CONFIG=/etc/haproxy/haproxy.cfg" "EXTRACONFIG=/etc/haproxy/remote_local_fallback.cfg" "PIDFILE=/run/haproxy.pid" "EXTRAOPTS=-S /run/haproxy-master.sock"
  become: true

# Add EXTRACONFIG to the HAProxy ExecStart
- name: Include EXTRACONFIG in the ExecStart command
  ansible.builtin.lineinfile:
    path: "/usr/lib/systemd/system/haproxy.service"
    regexp: '^ExecStart='
    line: ExecStart=/usr/sbin/haproxy -Ws -f $CONFIG -f $EXTRACONFIG -p $PIDFILE $EXTRAOPTS
  become: true

# Add EXTRACONFIG to the HAProxy ExecReload

- name: Include EXTRACONFIG in the ExecReload command
  ansible.builtin.lineinfile:
    path: "/usr/lib/systemd/system/haproxy.service"
    regexp: '^ExecReload='
    line: ExecReload=/usr/sbin/haproxy -Ws -f $CONFIG -f $EXTRACONFIG -c -q $EXTRAOPTS
  become: true

